# 알림을 받을 조건. 비워두면(빈 리스트) 해당 조건은 검사하지 않습니다.

# 공고 제목/지역에 이 단어 중 하나라도 있으면 통과. 비우면 전체 지역.
region_include:
  - 서울
  - 경기
  - 인천

# 이 단어가 들어간 공고는 무조건 제외 (지역/유형 무관)
exclude_keywords:
  - 상가
  - 토지
  - 주차장
  - 창고

# 제목에 이 단어가 있으면 우선순위 높음으로 표시(알림 색상 강조)
highlight_keywords:
  - 청년
  - 신혼
  - 행복주택
  - 매입임대
  - 전세임대

# 접수 마감일이 이미 지난 공고는 알리지 않음
skip_closed: true

# 신규 공고 외에, 기존 공고의 내용이 바뀐 경우에도 알림
notify_on_update: true
